<style>

.score{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOPIC = {arith:"Aritmetik", alg:"Cebir", geo:"Geometri", data:"Veri Analizi"};
const TYPE = {qc:"Quantitative Comparison", mc:"Çoktan seçmeli (tek)", ma:"Çoktan seçmeli (çoklu)", ne:"Numeric Entry", nef:"Numeric Entry (kesir)"};
const VAR = {easy:"Kolay", medium:"Orta", hard:"Zor"};
const QC_CH = ["Quantity A is greater.","Quantity B is greater.","The two quantities are equal.","The relationship cannot be determined from the information given."];
const SEC_TIME = {s1:21*60, s2:26*60};
const LS_RUN = "gql-run-v1", LS_RES = "gql-results-backup-v1";
const ls = {
  get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

const S = { db:null, dbState:"loading", tests:[], results:[], tab:"home", secCache:{}, run:null, view:null, err:"" };

/* ---------------- data (static: data/*.json + localStorage) ---------------- */
const RES_KEY = "gql-results-v1";
function makeStaticDb(){
  const readRes = () => ls.get(RES_KEY) || {};
  const writeRes = m => { try{ localStorage.setItem(RES_KEY, JSON.stringify(m)); return true; }catch(e){ return false; } };
  const getJSON = async p => { const r = await fetch(p, {cache:"no-cache"}); if (!r.ok){ const e = new Error("HTTP " + r.status); e.code = r.status; throw e; } return r.json(); };
  const snap = arr => ({ docs: arr.map(o => ({ id:o.id, data:() => o })) });
  return {
    collection(name){ return { async get(){
      if (name === "tests") return snap(await getJSON("data/tests.json"));
      if (name === "results") return snap(Object.values(readRes()));
      return snap([]);
    } }; },
    doc(path){
      const p = path.split("/");
      return {
        async get(){
          if (p[0] === "tests" && p[2] === "sections"){
            try{ const d = await getJSON("data/" + encodeURIComponent(p[1]) + "/" + encodeURIComponent(p[3]) + ".json"); return { exists:true, data:() => d }; }
            catch(e){ if (e.code === 404) return { exists:false, data:() => undefined }; throw e; }
          }
          if (p[0] === "results"){ const m = readRes(); return { exists:!!m[p[1]], data:() => m[p[1]] }; }
          return { exists:false, data:() => undefined };
        },
        async set(v){ if (p[0] !== "results") throw new Error("read-only"); const m = readRes(); m[p[1]] = v; if (!writeRes(m)){ const e = new Error("storage"); e.code = "storage"; throw e; } },
        async delete(){ if (p[0] !== "results") return; const m = readRes(); delete m[p[1]]; writeRes(m); }
      };
    }
  };
}

async function boot(){
  render();
  let db = null;
  try { db = makeStaticDb(); } catch(e){ db = null; }
  S.db = db; S.dbState = db ? "ok" : "none";
  await loadAll();
  const saved = ls.get(LS_RUN);
  if (saved && saved.testId) S.resumable = saved;
  render();
}
async function loadAll(){
  const backup = ls.get(LS_RES) || [];
  if (!S.db){ S.results = backup; return; }
  try{
    const ts = await S.db.collection("tests").get();
    S.tests = ts.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||"") || (b.no||b.drillNo||0) - (a.no||a.drillNo||0));
    const rs = await S.db.collection("results").get();
    S.results = rs.docs.map(d => ({ id:d.id, ...d.data() }));
    // push any locally-kept results that never reached the store
    for (const r of backup){
      if (!S.results.find(x => x.id === r.id)){
        try{ await S.db.doc("results/" + r.id).set(r); S.results.push(r); }catch(e){ S.results.push(r); }
      }
    }
    ls.del(LS_RES);
    S.results.sort((a,b) => (a.finishedAt||"").localeCompare(b.finishedAt||""));
  }catch(e){ S.err = "Veriler okunamadı (" + (e.code||"hata") + "). Sayfayı yenilemeyi dene."; S.results = backup; }
}
async function loadSection(testId, key){
  const ck = testId + "/" + key;
  if (S.secCache[ck]) return S.secCache[ck];
  const snap = await S.db.doc("tests/" + testId + "/sections/" + key).get();
  if (!snap.exists) throw new Error("Bölüm bulunamadı: " + key);
  S.secCache[ck] = snap.data();
  return S.secCache[ck];
}

/* ---------------- grading ---------------- */
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s/g,"").replace(",", ".");
  if (!s) return NaN;
  if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)){ const [a,b] = s.split("/").map(Number); return b === 0 ? NaN : a/b; }
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return Number(s);
}
const near = (a,b) => Math.abs(a-b) <= 1e-6 * Math.max(1, Math.abs(b));
function isAnswered(q, v){
  if (v == null) return false;
  if (q.type === "ma") return Array.isArray(v) && v.length > 0;
  if (q.type === "ne") return String(v).trim() !== "";
  if (q.type === "nef") return v && String(v.n||"").trim() !== "" && String(v.d||"").trim() !== "";
  return typeof v === "number";
}
function grade(q, v){
  if (!isAnswered(q, v)) return false;
  const a = q.answer;
  if (q.type === "qc" || q.type === "mc") return v === a;
  if (q.type === "ma") return [...v].sort().join(",") === [...a].sort().join(",");
  if (q.type === "ne") { const x = parseNum(v); return !isNaN(x) && near(x, a.value); }
  if (q.type === "nef") { const n = parseNum(v.n), d = parseNum(v.d); if (isNaN(n)||isNaN(d)||d===0) return false; return near(n/d, a.value[0]/a.value[1]); }
  return false;
}
function answerText(q, v){
  if (!isAnswered(q, v)) return "—";
  if (q.type === "qc") return "ABCD"[v];
  if (q.type === "mc") return "ABCDE"[v] + " (" + q.choices[v] + ")";
  if (q.type === "ma") return [...v].sort().map(i => "ABCDEFGH"[i] + " (" + q.choices[i] + ")").join(", ");
  if (q.type === "ne") return esc(v) + (q.unit_after||"");
  if (q.type === "nef") return esc(v.n) + "/" + esc(v.d);
}
function correctText(q){
  const a = q.answer;
  if (q.type === "qc") return "ABCD"[a];
  if (q.type === "mc") return "ABCDE"[a] + " (" + q.choices[a] + ")";
  if (q.type === "ma") return a.map(i => "ABCDEFGH"[i] + " (" + q.choices[i] + ")").join(", ");
  if (q.type === "ne") return a.value + (q.unit_after||"") + " <span class='muted small'>(eşdeğer yazımlar kabul)</span>";
  if (q.type === "nef") return a.value[0] + "/" + a.value[1] + " <span class='muted small'>(eşdeğer her kesir kabul)</span>";
}
function pickVariant(c1){ return c1 >= 8 ? "hard" : c1 >= 5 ? "medium" : "easy"; }
function estScore(c1, c2, variant){
  const w = {easy:0.7, medium:1.0, hard:1.35}[variant];
  const pts = c1 + c2*w, max = 12 + 15*1.35;
  return Math.round(Math.min(170, Math.max(130, 130 + 40*Math.pow(pts/max, 0.9))));
}
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };

/* ---------------- run (exam) ---------------- */
function saveRun(){ if (S.run) ls.set(LS_RUN, { ...S.run, marks:[...S.run.marks] }); }
async function startTest(testId, resume){
  S.err = "";
  try{
    let run;
    if (resume){ run = { ...resume, marks:new Set(resume.marks||[]) }; }
    else { const meta = S.tests.find(t => t.id === testId) || {}; const drill = meta.kind === "drill";
      run = { testId, drill, phase:drill ? "main" : "s1", variant:null, idx:0, answers:{}, marks:new Set(), times:{}, cheat:[], remaining:drill ? (meta.time||2100) : SEC_TIME.s1, hideTime:false, view:"q", startedAt:new Date().toISOString() }; }
    const key = run.phase === "s1" ? "s1" : run.phase === "main" ? "main" : run.variant;
    run.sec = null;
    S.run = run;
    const sec = await loadSection(run.testId, key);
    run.sec = sec;
    S.view = "exam";
    run.qStart = Date.now();
    saveRun(); render(); startTick();
  }catch(e){ S.err = "Deneme açılamadı: " + (e.message||e.code); S.run = null; render(); }
}
let tickH = null;
function startTick(){
  stopTick();
  let last = Date.now();
  tickH = setInterval(() => {
    const r = S.run; if (!r || S.view !== "exam") return;
    const now = Date.now(); const dt = (now - last)/1000; last = now;
    if (document.hidden) return;
    r.remaining -= dt;
    const el = $("#timer"); if (el){ el.textContent = r.hideTime ? "" : fmtT(r.remaining); el.classList.toggle("low", r.remaining < 300); }
    if (Math.floor(r.remaining) % 5 === 0) { commitTime(); saveRun(); }
    if (r.remaining <= 0) finishSection(true);
  }, 1000);
}
function stopTick(){ if (tickH) clearInterval(tickH); tickH = null; }
function commitTime(){
  const r = S.run; if (!r || !r.sec || r.view !== "q") { if (r) r.qStart = Date.now(); return; }
  const q = r.sec.questions[r.idx]; const now = Date.now();
  r.times[q.id] = (r.times[q.id]||0) + (now - (r.qStart||now))/1000; r.qStart = now;
}
function go(i){ const r = S.run; commitTime(); r.idx = i; r.view = "q"; r.qStart = Date.now();
  if (S.cheatOpen && r.sec && r.sec.cheat){ const id = r.sec.questions[i].id; r.cheat = r.cheat || []; if (!r.cheat.includes(id)) r.cheat.push(id); }
  saveRun(); render(); }
function setAns(qid, v){ S.run.answers[qid] = v; saveRun(); }

async function finishSection(timeout){
  const r = S.run; if (!r || r._finishing) return; r._finishing = true;
  commitTime();
  if (r.phase === "main"){ stopTick(); await finalize(); r._finishing = false; return; }
  if (r.phase === "s1"){
    const qs = r.sec.questions;
    const c1 = qs.filter(q => grade(q, r.answers[q.id])).length;
    r.variant = pickVariant(c1); r.c1 = c1; r.s1Ids = qs.map(q => q.id);
    r.phase = "break"; r.view = "break"; r.timeout = !!timeout; r._finishing = false;
    stopTick(); saveRun(); render();
    return;
  }
  stopTick();
  await finalize();
  r._finishing = false;
}
async function beginS2(){
  const r = S.run;
  try{
    const sec = await loadSection(r.testId, r.variant);
    r.sec = sec; r.phase = "s2"; r.idx = 0; r.view = "q"; r.remaining = SEC_TIME.s2; r.qStart = Date.now();
    saveRun(); render(); startTick();
  }catch(e){ S.err = "Bölüm 2 yüklenemedi: " + (e.message||e.code); render(); }
}
function noAnswers(r){ return !Object.values(r.answers||{}).some(v => v != null && v !== "" && !(Array.isArray(v) && !v.length) && !(typeof v === "object" && !Array.isArray(v) && !String(v.n||"").trim() && !String(v.d||"").trim())); }
function discardRun(msg){ stopTick(); ls.del(LS_RUN); S.run = null; S.resumable = null; S.quitAsk = false; S.cheatOpen = false; S.view = null; S.tab = "home"; S.err = msg || ""; render(); window.scrollTo(0,0); }
async function finalize(){
  const r = S.run;
  if (noAnswers(r)) return discardRun("Hiç soru cevaplanmadığı için bu deneme kaydedilmedi.");
  if (r.phase === "main") return finalizeDrill();
  const s1 = await loadSection(r.testId, "s1"), s2 = await loadSection(r.testId, r.variant);
  const items = [];
  const push = (sec, q, i) => items.push({ qid:q.id, section:sec, n:i+1, topic:q.topic, sub:q.sub, type:q.type,
    answered:isAnswered(q, r.answers[q.id]), correct:grade(q, r.answers[q.id]), answer:r.answers[q.id] ?? null, time:Math.round(r.times[q.id]||0) });
  s1.questions.forEach((q,i) => push("s1", q, i));
  s2.questions.forEach((q,i) => push(r.variant, q, i));
  const c1 = items.filter(x => x.section === "s1" && x.correct).length;
  const c2 = items.filter(x => x.section !== "s1" && x.correct).length;
  const test = S.tests.find(t => t.id === r.testId) || {};
  const res = { id:"r" + Date.now(), testId:r.testId, testNo:test.no||null, startedAt:r.startedAt, finishedAt:new Date().toISOString(),
    variant:r.variant, s1Correct:c1, s2Correct:c2, score:estScore(c1, c2, r.variant), items };
  let saved = false;
  if (S.db){ try{ await S.db.doc("results/" + res.id).set(res); saved = true; }catch(e){ saved = false; } }
  if (!saved){ const b = ls.get(LS_RES) || []; b.push(res); ls.set(LS_RES, b); res._local = true; }
  S.results.push(res);
  ls.del(LS_RUN); S.run = null; S.resumable = null;
  S.view = "result"; S.resultId = res.id; S.saveWarn = !saved;
  render(); window.scrollTo(0,0);
}

async function finalizeDrill(){
  if (noAnswers(S.run)) return discardRun("Hiç soru cevaplanmadığı için bu deneme kaydedilmedi.");
  const r = S.run, sec = await loadSection(r.testId, "main"), cheat = new Set(r.cheat||[]);
  const items = sec.questions.map((q,i) => ({ qid:q.id, section:"main", n:i+1, topic:q.topic, sub:q.sub, type:q.type,
    answered:isAnswered(q, r.answers[q.id]), correct:grade(q, r.answers[q.id]), answer:r.answers[q.id] ?? null, time:Math.round(r.times[q.id]||0), cheat:cheat.has(q.id) }));
  const test = S.tests.find(t => t.id === r.testId) || {};
  const res = { id:"r" + Date.now(), kind:"drill", testId:r.testId, drillNo:test.drillNo||null, title:test.title||"", startedAt:r.startedAt, finishedAt:new Date().toISOString(),
    correct:items.filter(x => x.correct).length, total:items.length, cheatCount:cheat.size, score:null, items };
  let saved = false;
  if (S.db){ try{ await S.db.doc("results/" + res.id).set(res); saved = true; }catch(e){ saved = false; } }
  if (!saved){ const b = ls.get(LS_RES) || []; b.push(res); ls.set(LS_RES, b); res._local = true; }
  S.results.push(res);
  ls.del(LS_RUN); S.run = null; S.resumable = null; S.cheatOpen = false;
  S.view = "result"; S.resultId = res.id; S.saveWarn = !saved;
  render(); window.scrollTo(0,0);
}

/* ---------------- calculator ---------------- */
const C = { open:false, toks:[], cur:"", mem:0, done:false, err:false, x:null, y:null };
const cval = () => C.cur !== "" ? Number(C.cur) : 0;
function cfmt(x){
  if (!isFinite(x)) return "Error";
  let s = Number(x.toPrecision(10)).toString();
  if (s.includes("e")) s = x.toPrecision(8);
  return s;
}
function cEval(toks){
  const out = [], ops = [], prec = {"+":1,"−":1,"×":2,"÷":2};
  for (const t of toks){
    if (typeof t === "number") out.push(t);
    else if (t === "(") ops.push(t);
    else if (t === ")"){ while (ops.length && ops[ops.length-1] !== "(") out.push(ops.pop()); ops.pop(); }
    else { while (ops.length && ops[ops.length-1] !== "(" && prec[ops[ops.length-1]] >= prec[t]) out.push(ops.pop()); ops.push(t); }
  }
  while (ops.length){ const o = ops.pop(); if (o !== "(") out.push(o); }
  const st = [];
  for (const t of out){
    if (typeof t === "number") st.push(t);
    else { const b = st.pop(), a = st.pop(); if (a === undefined || b === undefined) return NaN;
      st.push(t === "+" ? a+b : t === "−" ? a-b : t === "×" ? a*b : b === 0 ? NaN : a/b); }
  }
  return st.length === 1 ? st[0] : NaN;
}
function cDisp(){ return C.err ? "Error" : (C.cur !== "" ? C.cur : "0"); }
function cKey(k){
  if (C.err && k !== "C") return;
  const last = C.toks[C.toks.length-1];
  const isOp = t => ["+","−","×","÷"].includes(t);
  if (/^[0-9]$/.test(k)){
    if (C.done){ C.toks = []; C.cur = ""; C.done = false; }
    if (C.cur.replace(/[-.]/g,"").length >= 10) return;
    C.cur = (C.cur === "0" ? "" : C.cur === "-0" ? "-" : C.cur) + k;
  } else if (k === "."){
    if (C.done){ C.toks = []; C.cur = ""; C.done = false; }
    if (!C.cur.includes(".")) C.cur = (C.cur === "" || C.cur === "-" ? C.cur + "0" : C.cur) + ".";
  } else if (isOp(k)){
    C.done = false;
    if (C.cur !== ""){ C.toks.push(Number(C.cur)); C.cur = ""; }
    else if (isOp(last)) { C.toks[C.toks.length-1] = k; return cRender(); }
    else if (!C.toks.length || last === "(") C.toks.push(0);
    C.toks.push(k);
  } else if (k === "("){
    if (C.done){ C.toks = []; C.cur = ""; C.done = false; }
    if (C.cur === "") C.toks.push("(");
  } else if (k === ")"){
    const open = C.toks.filter(t => t === "(").length - C.toks.filter(t => t === ")").length;
    if (open > 0 && (C.cur !== "" || last === ")")){ if (C.cur !== ""){ C.toks.push(Number(C.cur)); C.cur = ""; } C.toks.push(")"); }
  } else if (k === "="){
    if (C.cur !== "") C.toks.push(Number(C.cur));
    else if (isOp(last)) C.toks.pop();
    let open = C.toks.filter(t => t === "(").length - C.toks.filter(t => t === ")").length;
    while (open-- > 0) C.toks.push(")");
    if (!C.toks.length) return cRender();
    const v = cEval(C.toks); C.toks = [];
    if (isNaN(v) || !isFinite(v)){ C.err = true; C.cur = ""; } else { C.cur = cfmt(v); C.done = true; }
  } else if (k === "√"){
    const v = cval(); if (v < 0){ C.err = true; } else { C.cur = cfmt(Math.sqrt(v)); C.done = true; }
  } else if (k === "±"){
    if (C.cur === "" ) C.cur = "-"; else if (C.cur === "-") C.cur = ""; else C.cur = C.cur.startsWith("-") ? C.cur.slice(1) : "-" + C.cur;
  } else if (k === "C"){ C.toks = []; C.cur = ""; C.err = false; C.done = false; }
  else if (k === "CE"){ C.cur = ""; C.err = false; }
  else if (k === "MC"){ C.mem = 0; }
  else if (k === "MR"){ C.cur = cfmt(C.mem); C.done = false; }
  else if (k === "M+"){ C.mem += cval(); C.done = true; }
  cRender();
}
function cRender(){
  const d = $("#cdisp"); if (d) d.textContent = cDisp();
  const m = $("#cmem"); if (m) m.textContent = C.mem !== 0 ? "M" : "";
  const tr = $("#ctr"); if (tr) tr.disabled = !canTransfer();
}
function canTransfer(){ const r = S.run; if (!r || !r.sec || r.view !== "q") return false; const q = r.sec.questions[r.idx]; return q && q.type === "ne"; }
function transfer(){
  if (!canTransfer() || C.err) return;
  const q = S.run.sec.questions[S.run.idx]; const v = cDisp();
  setAns(q.id, v); const inp = $("#ne-in"); if (inp) inp.value = v;
}
function calcHTML(){
  const keys = [["MR","MC","M+","(",")"],["7","8","9","÷","C"],["4","5","6","×","CE"],["1","2","3","−","√"],["0",".","±","+","="]];
  const cls = k => ["÷","×","−","+","√","(",")","MR","MC","M+","C","CE","±"].includes(k) ? "op" : k === "=" ? "eq" : "";
  const pos = C.x != null ? `style="left:${C.x}px;top:${C.y}px;right:auto;bottom:auto"` : "";
  return `<div class="calc" id="calc" ${pos} role="dialog" aria-label="Hesap makinesi">
    <div class="hd" id="chd"><span>Calculator</span><button data-a="calc-close" aria-label="Kapat">×</button></div>
    <div class="body"><button class="btn tr" id="ctr" data-a="transfer">Transfer Display</button>
    <div class="disp"><span class="mem" id="cmem"></span><span id="cdisp">0</span></div>
    <div class="keys">${keys.flat().map(k => `<button class="${cls(k)}" data-ck="${k}">${k}</button>`).join("")}</div></div></div>`;
}
function bindCalcDrag(){
  const hd = $("#chd"), box = $("#calc"); if (!hd || !box || window.matchMedia("(max-width:620px)").matches) return;
  let sx, sy, ox, oy, on = false;
  hd.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; on = true; const r = box.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; hd.setPointerCapture(e.pointerId); });
  hd.addEventListener("pointermove", e => { if (!on) return; C.x = Math.max(0, Math.min(window.innerWidth - 280, ox + e.clientX - sx)); C.y = Math.max(0, Math.min(window.innerHeight - 60, oy + e.clientY - sy)); box.style.left = C.x + "px"; box.style.top = C.y + "px"; box.style.right = "auto"; box.style.bottom = "auto"; });
  hd.addEventListener("pointerup", () => on = false);
}

function aggregate(key){

  const topics = aggregate(it => it.topic);
  const full = rs.filter(r => r.kind !== "drill");
  let h = full.length ? `<div class="section-title">Tahmini puan (130–170)</div><div class="card chart">${scoreChart(full)}</div>` : "";
  h += `<div class="two" style="margin-top:14px"><div class="card"><div class="num">EN ZAYIF 3 KONU</div>` +
    weak.map(w => `<div><div class="row"><strong style="font-size:14px">${esc(w.k)}</strong><span class="sp"></span><span class="tnum small">${w.c}/${w.n}</span></div><div class="meter"><i style="width:${Math.round(w.c/w.n*100)}%"></i></div></div>`).join("") +
    `</div><div class="card"><div class="num">ANA KONULAR</div><table class="acc-table"><tbody>` +
    topics.map(t => `<tr><td>${TOPIC[t.k]}</td><td class="r tnum">${t.c}/${t.n}</td><td class="r tnum">%${Math.round(t.c/t.n*100)}</td></tr>`).join("") + `</tbody></table></div></div>`;
  h += `<div class="section-title">Tüm denemeler</div><div class="rev"><table><thead><tr><th>Tarih</th><th>Deneme</th><th>Bölüm 2</th><th class="tnum">Doğru</th><th>Tahmini</th></tr></thead><tbody>` +
    rs.slice().reverse().map(r => r.kind === "drill" ? `<tr data-a="show-res" data-v="${r.id}"><td class="tnum">${esc((r.finishedAt||"").slice(0,10))}</td><td>Konu testi ${r.drillNo||""}</td><td>—</td><td class="tnum">${r.correct}/${r.total}</td><td class="muted">—</td></tr>` : `<tr data-a="show-res" data-v="${r.id}"><td class="tnum">${esc((r.finishedAt||"").slice(0,10))}</td><td>${r.testNo ? "Deneme " + r.testNo : esc(r.testId)}</td><td>${VAR[r.variant]}</td><td class="tnum">${r.s1Correct + r.s2Correct}/27</td><td class="tnum"><strong>${r.score}</strong></td></tr>`).join("") + `</tbody></table></div>`;
  return h;
}
function scoreChart(rs){
  const W = 640, H = 220, L = 40, R = 16, T = 14, B = 30, pw = W-L-R, ph = H-T-B;
  const n = rs.length, x = i => L + (n === 1 ? pw/2 : i*pw/(n-1)), y = v => T + ph - (v-130)/40*ph;
  let g = "";
  for (let v = 130; v <= 170; v += 10) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--fig-grid);stroke-width:1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mute);font-size:11px">${v}</text>`;
  const pts = rs.map((r,i) => `${x(i)},${y(r.score)}`).join(" ");
  if (n > 1) g += `<polygon points="${x(0)},${y(130)} ${pts} ${x(n-1)},${y(130)}" style="fill:var(--acc-soft);stroke:none"/><polyline points="${pts}" style="fill:none;stroke:var(--acc);stroke-width:2"/>`;
  rs.forEach((r,i) => { g += `<circle cx="${x(i)}" cy="${y(r.score)}" r="${i===n-1?5:3.5}" style="fill:var(--acc);stroke:var(--panel);stroke-width:2"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" style="fill:var(--mute);font-size:11px">#${i+1}</text>`; });
  const lr = rs[n-1]; g += `<text x="${Math.min(x(n-1)+8, W-R-30)}" y="${y(lr.score)-8}" style="fill:var(--ink);font-size:12px;font-weight:700">${lr.score}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Deneme puanları">${g}</svg>`;
}

function qHTML(q, sec, r){
  const v = r.answers[q.id];
  let body = "";
  if (q.fig) body += `<div class="fig">${q.fig}</div>`;
  if (q.type === "qc"){
    body += (q.given ? `<div class="qtext given">${q.given}</div>` : "") +
      `<div class="qcgrid qtext"><div class="h">Quantity A</div><div class="h">Quantity B</div><div>${q.qa}</div><div>${q.qb}</div></div>` +
      `<div class="opts">${QC_CH.map((c,i) => `<button class="opt" role="radio" aria-checked="${v===i}" data-a="pick" data-v="${i}"><span class="m"></span><span class="ql">${"ABCD"[i]}</span><span style="font-family:var(--ui);font-size:15px">${c}</span></button>`).join("")}</div>`;
  } else {
    body = `<div class="qtext">${q.stem}</div>` + body;
    if (q.type === "mc") body += `<div class="opts" role="radiogroup">${q.choices.map((c,i) => `<button class="opt" role="radio" aria-checked="${v===i}" data-a="pick" data-v="${i}"><span class="m"></span><span>${c}</span></button>`).join("")}</div>`;
    if (q.type === "ma") body += `<div class="opts">${q.choices.map((c,i) => `<button class="opt sq" role="checkbox" aria-checked="${Array.isArray(v)&&v.includes(i)}" data-a="multi" data-v="${i}"><span class="m"></span><span>${c}</span></button>`).join("")}</div>`;
    if (q.type === "ne") body += `<div class="ne"><input id="ne-in" inputmode="decimal" autocomplete="off" aria-label="Cevap" value="${esc(v||"")}">${q.unit_after ? `<span>${q.unit_after}</span>` : ""}</div>`;
    if (q.type === "nef") body += `<div class="ne"><div class="nef"><input id="nef-n" inputmode="numeric" autocomplete="off" aria-label="Pay" value="${esc(v&&v.n||"")}"><hr><input id="nef-d" inputmode="numeric" autocomplete="off" aria-label="Payda" value="${esc(v&&v.d||"")}"></div></div>`;
  }
  if (q.set && sec.sets && sec.sets[q.set]){
    const st = sec.sets[q.set];
    return `<div class="split"><div class="stim"><p class="intro">${st.intro}</p>${st.html}</div><div>${body}</div></div>`;
  }
  return body;
}

  const wrong = qs.map((q,i) => ({q, n:i+1})).filter(x => !grade(x.q, r.answers[x.q.id]));
  if (!wrong.length) return `<p class="small muted" style="margin:0 0 6px">Bölüm 1'de yanlışın yok.</p>`;
  let h = `<div class="row" style="margin-bottom:6px"><button class="btn" data-a="s1wrong">${S.showS1Wrong ? "Yanlışları gizle" : `Yanlışlarımı göster (${wrong.length})`}</button><span class="small muted">Bölüm 2'nin süresi sen başlatana kadar işlemez.</span></div>`;
  if (!S.showS1Wrong) return h;
  const sec = r.sec;
  wrong.forEach(({q, n}) => {
    const v = r.answers[q.id];
    const pill = isAnswered(q, v) ? `<span class="pill bad">Yanlış</span>` : `<span class="pill skip">Boş</span>`;
    const stim = q.set && sec.sets && sec.sets[q.set] ? `<div class="stim" style="margin-bottom:12px">${sec.sets[q.set].html}</div>` : "";
    const qb = q.type === "qc" ? `${q.fig ? `<div class="fig">${q.fig}</div>` : ""}${q.given ? `<div class="qtext given">${q.given}</div>` : ""}<div class="qcgrid qtext"><div class="h">Quantity A</div><div class="h">Quantity B</div><div>${q.qa}</div><div>${q.qb}</div></div>`
      : `<div class="qtext">${q.stem}</div>${q.fig ? `<div class="fig">${q.fig}</div>` : ""}${q.choices ? `<ol type="A" style="font-family:var(--serif)">${q.choices.map(c => `<li>${c}</li>`).join("")}</ol>` : ""}`;
    h += `<details class="qrow"><summary><span class="tnum" style="font-weight:700;width:26px">${n}</span>${pill}<span class="small">${TOPIC[q.topic]} · ${esc(q.sub)}</span><span class="sp"></span><span class="tnum small muted">${fmtT(r.times[q.id]||0)}</span></summary>

  });
  return h;
}

let _resSecs = {};
async function loadResultSecs(){
  S._needSecs = false;
  const res = S.results.find(r => r.id === S.resultId); if (!res || !S.db) return;
  try{ _resSecs = res.kind === "drill" ? { forId:res.id, s1: await loadSection(res.testId, "main"), s2: { questions: [] } } : { forId:res.id, s1: await loadSection(res.testId, "s1"), s2: await loadSection(res.testId, res.variant) }; }catch(e){ _resSecs = { forId:res.id, failed:true }; }
  render();
}
function resultHTML(res){
  if (!res) { S.view = null; return homeHTML(); }
  const secs = _resSecs.s1 && _resSecs.forId === res.id ? _resSecs : null;
  if (!secs && S.db && _resSecs.forId !== res.id){ S._needSecs = true; _resSecs = { forId:res.id }; }
  const qById = {}; if (secs){ secs.s1.questions.forEach(q => qById[q.id] = q); secs.s2.questions.forEach(q => qById[q.id] = q); }
  const items = res.items||[];
  const agg = key => { const m = {}; items.forEach(it => { const k = key(it); m[k] = m[k] || {k,n:0,c:0,t:0}; m[k].n++; if (it.correct) m[k].c++; m[k].t += it.time||0; }); return Object.values(m); };
  const tbl = (rows, lab) => `<table class="acc-table"><thead><tr><th>${lab}</th><th class="r">Doğru</th><th></th><th class="r">Ort. süre</th></tr></thead><tbody>` +
    rows.map(x => `<tr><td>${x.label}</td><td class="r tnum">${x.c}/${x.n}</td><td style="width:30%"><div class="meter"><i style="width:${Math.round(x.c/x.n*100)}%"></i></div></td><td class="r tnum">${fmtT(x.t/x.n)}</td></tr>`).join("") + `</tbody></table>`;
  const byTopic = agg(it => it.topic).map(x => ({...x, label:TOPIC[x.k]}));
  const byType = agg(it => it.type).map(x => ({...x, label:TYPE[x.k]}));
  const total = items.reduce((s,it) => s + (it.time||0), 0);
  let h = `<div class="wrap"><div class="brand"><h1><span>SONUÇ · ${esc((res.finishedAt||"").slice(0,10))}</span>${res.kind === "drill" ? "Konu testi " + (res.drillNo||"") : res.testNo ? "Deneme " + res.testNo : esc(res.testId)}</h1>
    <div class="row"><button class="btn" data-a="home">Denemelere dön</button><button class="btn" data-a="tab" data-v="hist">Geçmiş</button><button class="btn ghost" data-a="del-res">Sonucu sil</button></div></div>`;
  if (S.delAsk) h += `<div class="confirm" style="margin-bottom:14px;border-color:var(--bad)"><strong>Bu sonuç silinsin mi?</strong><p class="small muted" style="margin:4px 0 10px">Puan grafiğinden ve zayıf konu analizinden çıkarılır. Geri alınamaz.</p><div class="row"><button class="btn" data-a="del-no">Vazgeç</button><button class="btn pri" data-a="del-yes" style="background:var(--bad);border-color:var(--bad)">Sil</button></div></div>`;
  if (S.saveWarn) h += `<p class="err">Sonuç bu tarayıcıya kaydedilemedi (tarayıcı depolaması kapalı olabilir). Sayfayı kapatınca bu sonuç kaybolur.</p>`;
  if (res.kind === "drill") h += `<div class="score"><div><div class="lab">Doğru</div><div class="big tnum">${res.correct}<span style="font-size:28px;color:var(--mute)">/${res.total}</span></div></div>
    <div><div class="lab">Toplam süre</div><div class="tnum" style="font-size:22px;font-weight:700">${fmtT(total)}</div></div>
    <div><div class="lab">Formül kartı açılan soru</div><div class="tnum" style="font-size:22px;font-weight:700">${res.cheatCount||0}</div></div>
    <p class="note" style="flex-basis:100%;margin:0">Konu testleri 130–170 tahminine ve puan grafiğine katılmaz; zayıf konu analizine katılır.</p></div>`;
  else h += `<div class="score"><div><div class="lab">Tahmini puan</div><div class="big tnum">${res.score}</div></div>
    <div><div class="lab">Bölüm 1</div><div class="tnum" style="font-size:22px;font-weight:700">${res.s1Correct}/12</div></div>
    <div><div class="lab">Bölüm 2 · ${VAR[res.variant]}</div><div class="tnum" style="font-size:22px;font-weight:700">${res.s2Correct}/15</div></div>
    <div><div class="lab">Toplam süre</div><div class="tnum" style="font-size:22px;font-weight:700">${fmtT(total)}</div></div>
    <p class="note" style="flex-basis:100%;margin:0">Bu puan bir tahmindir: doğru sayını ve Bölüm 2'nin zorluğunu kaba bir ağırlıkla 130–170 ölçeğine çevirir. ETS'nin gerçek puanlama tablosu yayımlanmıyor.</p></div>`;
  h += `<div class="two" style="margin-top:14px"><div class="card"><div class="num">KONU BAZINDA</div>${tbl(byTopic, "Konu")}</div><div class="card"><div class="num">SORU TİPİ BAZINDA</div>${tbl(byType, "Tip")}</div></div>`;
  h += `<div class="section-title">Sorular ve çözümler</div>`;
  if (!secs) h += `<p class="muted small">${_resSecs.failed ? "Çözümler yüklenemedi." : "Çözümler yükleniyor…"}</p>`;
  let lastSec = null;
  items.forEach(it => {
    if (it.section !== lastSec){ lastSec = it.section; h += `<p class="num" style="margin:16px 0 8px">${it.section === "main" ? "KONU TESTİ" : it.section === "s1" ? "BÖLÜM 1" : "BÖLÜM 2 · " + VAR[it.section].toUpperCase()}</p>`; }
    const q = qById[it.qid];
    const pill = !it.answered ? `<span class="pill skip">Boş</span>` : it.correct ? `<span class="pill ok">Doğru</span>` : `<span class="pill bad">Yanlış</span>`;
    h += `<details class="qrow"><summary><span class="tnum" style="font-weight:700;width:26px">${it.n}</span>${pill}<span class="small">${TOPIC[it.topic]} · ${esc(it.sub)}</span>${it.cheat ? `<span class="chip">Formüle bakıldı</span>` : ""}<span class="sp"></span><span class="chip">${TYPE[it.type]}</span><span class="tnum small muted">${fmtT(it.time)}</span></summary>`;
    if (q){
      const sec = it.section === "s1" || it.section === "main" ? secs.s1 : secs.s2;
      const stim = q.set && sec.sets && sec.sets[q.set] ? `<div class="stim" style="margin-bottom:12px">${sec.sets[q.set].html}</div>` : "";
      const qb = q.type === "qc" ? `${q.fig ? `<div class="fig">${q.fig}</div>` : ""}${q.given ? `<div class="qtext given">${q.given}</div>` : ""}<div class="qcgrid qtext"><div class="h">Quantity A</div><div class="h">Quantity B</div><div>${q.qa}</div><div>${q.qb}</div></div>`
        : `<div class="qtext">${q.stem}</div>${q.fig ? `<div class="fig">${q.fig}</div>` : ""}${q.choices ? `<ol type="A" style="font-family:var(--serif)">${q.choices.map(c => `<li>${c}</li>`).join("")}</ol>` : ""}`;
      h += `<div class="det">${stim}${qb}<p class="small"><strong>Senin cevabın:</strong> ${answerText(q, it.answer)} &nbsp;·&nbsp; <strong>Doğru cevap:</strong> ${correctText(q)}</p>
        <div class="sol"><b>Adım adım çözüm</b>${q.expl}</div>${q.short ? `<div class="sol"><b>Kısayol</b>${q.short}</div>` : ""}</div>`;
    }
    h += `</details>`;
  });
  return h + `</div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const ck = e.target.closest("[data-ck]"); if (ck){ cKey(ck.dataset.ck); return; }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, r = S.run;
  if (a === "fs"){ try{ if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(err){ S.fsFail = true; } render(); return; }
  if (a === "tab"){ S.tab = v; S.view = null; render(); return; }
  if (a === "home"){ S.view = null; S.tab = "home"; S.saveWarn = false; render(); return; }
  if (a === "start"){ ls.del(LS_RUN); S.resumable = null; C.toks = []; C.cur = ""; C.mem = 0; C.open = false; startTest(v); return; }
  if (a === "resume"){ const sv = S.resumable; S.resumable = null; C.open = false;
    if (sv.phase === "break"){ S.run = { ...sv, marks:new Set(sv.marks||[]) }; S.view = "exam"; render(); } else startTest(sv.testId, sv); return; }
  if (a === "discard"){ ls.del(LS_RUN); S.resumable = null; render(); return; }
  if (a === "show-res"){ S.view = "result"; S.resultId = v; S.saveWarn = false; S.delAsk = false; render(); window.scrollTo(0,0); return; }
  if (a === "del-res"){ S.delAsk = true; render(); return; }
  if (a === "del-no"){ S.delAsk = false; render(); return; }
  if (a === "del-yes"){ const id = S.resultId; S.delAsk = false;
    try{ if (S.db) await S.db.doc("results/" + id).delete(); }catch(e){ S.err = "Sonuç silinemedi (" + (e.code||"hata") + ")."; }
    const b = ls.get(LS_RES) || []; ls.set(LS_RES, b.filter(x => x.id !== id));
    S.results = S.results.filter(x => x.id !== id); S.view = null; S.tab = "hist"; render(); return; }
  if (a === "quit"){ S.quitAsk = true; render(); window.scrollTo(0,0); return; }
  if (a === "quit-no"){ S.quitAsk = false; render(); return; }
  if (a === "quit-yes"){ discardRun(""); return; }
  if (a === "s1wrong"){ S.showS1Wrong = !S.showS1Wrong; render(); return; }
  if (a === "begin-s2"){ S.showS1Wrong = false; beginS2(); return; }
  if (!r) return;
  const q = r.sec && r.sec.questions[r.idx];
  if (a === "pick"){ setAns(q.id, Number(v)); el.parentElement.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", String(b === el))); return; }
  if (a === "multi"){ const cur = Array.isArray(r.answers[q.id]) ? [...r.answers[q.id]] : []; const i = Number(v); const k = cur.indexOf(i); k >= 0 ? cur.splice(k,1) : cur.push(i); setAns(q.id, cur); el.setAttribute("aria-checked", String(k < 0)); return; }
  if (a === "mark"){ r.marks.has(q.id) ? r.marks.delete(q.id) : r.marks.add(q.id); el.classList.toggle("on"); saveRun(); return; }
  if (a === "review"){ commitTime(); r.view = r.view === "review" ? "q" : "review"; r.confirmExit = false; r.qStart = Date.now(); saveRun(); render(); return; }
  if (a === "goto"){ go(Number(v)); return; }
  if (a === "prev"){ if (r.idx > 0) go(r.idx - 1); return; }
  if (a === "next"){
    if (r.view === "review"){ r.confirmExit = true; render(); return; }
    if (r.idx < r.sec.questions.length - 1) go(r.idx + 1);
    else { commitTime(); r.view = "review"; r.confirmExit = false; saveRun(); render(); }
    return;
  }
  if (a === "exit-no"){ r.confirmExit = false; render(); return; }
  if (a === "exit-yes"){ r.confirmExit = false; finishSection(false); return; }
  if (a === "calc"){ C.open = !C.open; render(); return; }
  if (a === "calc-close"){ C.open = false; render(); return; }
  if (a === "cheat"){ S.cheatOpen = !S.cheatOpen; if (S.cheatOpen && r.view === "q" && q){ r.cheat = r.cheat || []; if (!r.cheat.includes(q.id)) r.cheat.push(q.id); saveRun(); } const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (a === "transfer"){ transfer(); return; }
  if (a === "hide-time"){ r.hideTime = !r.hideTime; saveRun(); render(); return; }
});
document.addEventListener("input", e => {
  const r = S.run; if (!r || !r.sec) return; const q = r.sec.questions[r.idx];
  if (e.target.id === "ne-in") setAns(q.id, e.target.value.replace(/[^0-9.,\-\/]/g, "").slice(0, 12));
  if (e.target.id === "nef-n" || e.target.id === "nef-d"){ const n = $("#nef-n").value.replace(/[^0-9\-]/g,"").slice(0,8), d = $("#nef-d").value.replace(/[^0-9\-]/g,"").slice(0,8); setAns(q.id, {n, d}); }
});
document.addEventListener("keydown", e => {
  if (!C.open || S.view !== "exam" || e.target.tagName === "INPUT") return;
  const map = {"+":"+","-":"−","*":"×","/":"÷","Enter":"=","=":"=","Escape":"C","Backspace":"CE","(":"(",")":")",".":".",",":"."};
  const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if (k){ e.preventDefault(); cKey(k); }
});
document.addEventListener("fullscreenchange", () => render());
document.addEventListener("visibilitychange", () => { if (S.run && S.view === "exam"){ if (document.hidden) { commitTime(); saveRun(); } else S.run.qStart = Date.now(); } });

boot();
})();
</script>
